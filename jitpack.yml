jdk:
  - openjdk17

before_install:
  - wget -q -O "$HOME/flutter.tar.xz" https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.29.2-stable.tar.xz && tar -xf "$HOME/flutter.tar.xz" -C "$HOME" && git config --global --add safe.directory "$HOME/flutter" && $HOME/flutter/bin/flutter config --no-analytics && $HOME/flutter/bin/flutter --version && python3 --version

install:
  - $HOME/flutter/bin/flutter pub get && python3 tool/configure_flutter_aars.py && $HOME/flutter/bin/flutter build aar --no-profile --no-pub && python3 tool/publish_flutter_aars.py
  - find $HOME/.m2/repository/com/github/DhruvPanchalSL/jitlabtestingmodule -type f